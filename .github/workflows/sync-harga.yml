name: Sinkron harga

# Google Sheet = sumber harga. Action ini mengambil cerminannya, membangun ulang halaman statis,
# lalu commit kalau ada yang berubah. Data publik saja, tanpa secret.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['tools/**', 'tests/**', 'data/**', 'index.html', '.github/workflows/sync-harga.yml']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/*.test.js

  sync:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/sync-prices.js
      - run: node tools/build.js
      - name: Commit kalau berubah
        run: |
          git config user.name "xnk-bot"
          git config user.email "xnk-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; else git commit -m "Sinkron harga dari Sheet" && git push; fi
