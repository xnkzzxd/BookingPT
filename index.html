    <style>
        html, body {

            padding: 0;
            height: 100%;

        iframe {

            border: 0;
            background: #ECECEC;

        /* Layar tunggu: menyatu dengan intro 00–100 di dalam halaman */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 24px;
            box-sizing: border-box;
            background: #ECECEC;
            color: #0B0B0B;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            transition: opacity .5s ease, visibility .5s ease;
        }
        .screen.done {
            opacity: 0;
            visibility: hidden;
        }
        .mark {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: #0B0B0B;
            display: grid;
            place-items: center;
        }
        .mark svg {
            width: 30px;
            height: 30px;
        }
        .bar {
            width: min(260px, 60vw);
            height: 2px;
            background: rgba(11, 11, 11, .12);
            overflow: hidden;
        }
        .bar i {
            display: block;
            width: 40%;
            height: 100%;
            background: #0B0B0B;
            animation: slide 1.2s cubic-bezier(.76, 0, .24, 1) infinite;
        }
        @keyframes slide {
            from { transform: translateX(-100%); }
            to { transform: translateX(250%); }
        }
        .cap {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #565656;
        }
        .screen a {
            color: #0B0B0B;
            font-size: 14px;
            font-weight: 600;
        }
        .screen a[hidden] {
            display: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .bar i { animation-duration: 3s; }
        }
    </style>
